[project]
name = "task-tracker-diplom"
version = "0.1.0"
description = ""
authors = [
    {name = "Виктор Бугай",email = "ascon2913@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "python-dotenv (>=1.0.1,<2.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "django (>=5.1.6,<6.0.0)",
    "djangorestframework (>=3.15.2,<4.0.0)",
    "djangorestframework-simplejwt (>=5.4.0,<6.0.0)",
    "ipython (>=8.32.0,<9.0.0)",
    "django-cors-headers (>=4.6.0,<5.0.0)",
    "drf-yasg (>=1.21.8,<2.0.0)",
    "celery (>=5.4.0,<6.0.0)",
    "eventlet (>=0.39.0,<0.40.0)",
    "redis (>=5.2.1,<6.0.0)",
    "coverage (>=7.6.10,<8.0.0)",
    "django-celery-beat (>=2.7.0,<3.0.0)",
    "django-filter (>=24.3,<25.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
black = "^25.1.0"
isort = "^6.0.0"
mypy = "^1.15.0"
flake8 = "^7.1.1"

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py
                     # в корне проекта
)
'''
